# Version Bump
#
# Auto-increments the version across Makefile and chart/Chart.yaml.
# Creates a commit on the current branch with the new version.
#
# CONTRIBUTOR TODO:
#   - Ensure your Makefile has a BASE_VERSION variable
#   - Add additional files to update if you store versions elsewhere
#     (e.g., chart/values.yaml image tags)

name: "Version Bump"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  bump:
    name: Bump Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate new version
        id: version
        run: |
          CURRENT=$(grep '^BASE_VERSION' Makefile | cut -d'=' -f2 | tr -d ' ')
          if [ -z "$CURRENT" ]; then
            echo "::error::No BASE_VERSION found in Makefile"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"

          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${{ inputs.bump }}: ${CURRENT} -> ${NEW}"

      - name: Update Makefile
        run: |
          sed -i "s/^BASE_VERSION.*=.*/BASE_VERSION = ${{ steps.version.outputs.new }}/" Makefile

      - name: Update Chart.yaml
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.new }}/" chart/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.new }}\"/" chart/Chart.yaml

      # CONTRIBUTOR TODO: add additional version update steps if needed
      # Example: update image tags in values.yaml
      # - name: Update values.yaml
      #   run: |
      #     sed -i "s/tag:.*/tag: \"${{ steps.version.outputs.new }}\"/" chart/values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump version: ${{ steps.version.outputs.current }} -> ${{ steps.version.outputs.new }}"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
